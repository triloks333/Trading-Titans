<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Surya Yantra Trading App Icon</title>
  <desc>Amber gold trading app icon with Vedic yantra geometry, sun rays, and Rupee symbol. Vastu: East direction. Jyotish: Surya (Sun).</desc>

  <!-- App icon rounded square background -->
  <rect width="512" height="512" rx="114" ry="114" fill="#BA7517"/>

  <!-- Inner dark amber surface -->
  <rect x="40" y="40" width="432" height="432" rx="86" ry="86" fill="#6B3A08"/>

  <!-- Subtle square frame (yantra outer boundary) -->
  <rect x="80" y="80" width="352" height="352" rx="12" fill="none" stroke="#EF9F27" stroke-width="2" opacity="0.5"/>

  <!-- Corner lotus buds (yantra bhupura / gate markers) -->
  <!-- Top-left -->
  <ellipse cx="108" cy="108" rx="14" ry="7" fill="#EF9F27" opacity="0.45" transform="rotate(-45 108 108)"/>
  <!-- Top-right -->
  <ellipse cx="404" cy="108" rx="14" ry="7" fill="#EF9F27" opacity="0.45" transform="rotate(45 404 108)"/>
  <!-- Bottom-left -->
  <ellipse cx="108" cy="404" rx="14" ry="7" fill="#EF9F27" opacity="0.45" transform="rotate(45 108 404)"/>
  <!-- Bottom-right -->
  <ellipse cx="404" cy="404" rx="14" ry="7" fill="#EF9F27" opacity="0.45" transform="rotate(-45 404 404)"/>

  <!-- Outer yantra circle ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#EF9F27" stroke-width="2.5"/>

  <!-- Middle ring -->
  <circle cx="256" cy="256" r="138" fill="none" stroke="#FAC775" stroke-width="1.2" opacity="0.7"/>

  <!-- 8 sun rays — elongated triangles radiating outward -->
  <!-- Top -->
  <polygon points="256,72 240,138 272,138" fill="#FAC775" opacity="0.85"/>
  <!-- Bottom -->
  <polygon points="256,440 240,374 272,374" fill="#FAC775" opacity="0.85"/>
  <!-- Left -->
  <polygon points="72,256 138,240 138,272" fill="#FAC775" opacity="0.85"/>
  <!-- Right -->
  <polygon points="440,256 374,240 374,272" fill="#FAC775" opacity="0.85"/>
  <!-- Top-right diagonal -->
  <polygon points="392,120 338,176 362,200" fill="#FAC775" opacity="0.65"/>
  <!-- Bottom-right diagonal -->
  <polygon points="392,392 338,336 362,312" fill="#FAC775" opacity="0.65"/>
  <!-- Bottom-left diagonal -->
  <polygon points="120,392 174,336 150,312" fill="#FAC775" opacity="0.65"/>
  <!-- Top-left diagonal -->
  <polygon points="120,120 174,176 150,200" fill="#FAC775" opacity="0.65"/>

  <!-- 8 secondary short ray dots (between rays, like Surya's corona) -->
  <circle cx="256" cy="84"  r="5" fill="#FAC775" opacity="0.5"/>
  <circle cx="256" cy="428" r="5" fill="#FAC775" opacity="0.5"/>
  <circle cx="84"  cy="256" r="5" fill="#FAC775" opacity="0.5"/>
  <circle cx="428" cy="256" r="5" fill="#FAC775" opacity="0.5"/>
  <circle cx="382" cy="130" r="4" fill="#FAC775" opacity="0.4"/>
  <circle cx="382" cy="382" r="4" fill="#FAC775" opacity="0.4"/>
  <circle cx="130" cy="382" r="4" fill="#FAC775" opacity="0.4"/>
  <circle cx="130" cy="130" r="4" fill="#FAC775" opacity="0.4"/>

  <!-- Inner lotus petals ring (8 petals — Ashtalakshmi reference) -->
  <ellipse cx="256" cy="182" rx="18" ry="32" fill="#EF9F27" opacity="0.55"/>
  <ellipse cx="256" cy="330" rx="18" ry="32" fill="#EF9F27" opacity="0.55"/>
  <ellipse cx="182" cy="256" rx="32" ry="18" fill="#EF9F27" opacity="0.55"/>
  <ellipse cx="330" cy="256" rx="32" ry="18" fill="#EF9F27" opacity="0.55"/>

  <ellipse cx="210" cy="210" rx="18" ry="32" fill="#EF9F27" opacity="0.38" transform="rotate(-45 210 210)"/>
  <ellipse cx="302" cy="210" rx="18" ry="32" fill="#EF9F27" opacity="0.38" transform="rotate(45 302 210)"/>
  <ellipse cx="302" cy="302" rx="18" ry="32" fill="#EF9F27" opacity="0.38" transform="rotate(-45 302 302)"/>
  <ellipse cx="210" cy="302" rx="18" ry="32" fill="#EF9F27" opacity="0.38" transform="rotate(45 210 302)"/>

  <!-- Center bindu circle (seat of divine energy) -->
  <circle cx="256" cy="256" r="88" fill="#EF9F27"/>
  <!-- Inner shine ring on bindu -->
  <circle cx="256" cy="256" r="82" fill="none" stroke="#FAC775" stroke-width="1.5" opacity="0.6"/>

  <!-- Rupee ₹ symbol — centered at bindu -->
  <path
    d="M4 3.06h2.726c1.22 0 2.12.575 2.325 1.724H4v1.051h5.051C8.855 7.001 8 7.558 6.788 7.558H4v1.317L8.437 14h2.11L6.095 8.884h.855c2.316-.018 3.465-1.476 3.688-3.049H12V4.784h-1.345c-.08-.778-.357-1.335-.793-1.732H12V2H4z"
    fill="#412402"
    transform="translate(256, 256) scale(9.5) translate(-8, -8)"
  />

</svg>
