name: PR Checks

# Lightweight pull-request hygiene checks. Verify-only, no deploys, no secrets.
# Both checks are ADVISORY for now (continue-on-error) so they inform without
# blocking merges. Flip them to hard gates once you're happy with them.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Flags risky dependency changes introduced by the PR.
      # Requires the dependency graph (public repo, or GHAS on private repos),
      # so it's advisory here and simply skips if unavailable.
      - name: Review dependency changes (advisory)
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  pr-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      # Nudges PR titles toward conventional-commit style (feat:, fix:, etc.).
      - name: Validate PR title (advisory)
        continue-on-error: true
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf
            build
