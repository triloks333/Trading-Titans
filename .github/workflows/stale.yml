name: Stale issues & PRs

# Housekeeping only: labels and (eventually) closes long-inactive issues/PRs.
# It never touches code, deploys, or secrets.

on:
  schedule:
    - cron: '30 1 * * *' # daily at 01:30 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has been inactive for 30 days and will be closed in 7
            days if there's no further activity. Comment to keep it open.
          stale-pr-message: >
            This PR has been inactive for 30 days and will be closed in 7 days
            if there's no further activity. Comment or push to keep it open.
          exempt-issue-labels: pinned,security
          exempt-pr-labels: pinned,security
