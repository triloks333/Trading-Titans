name: CI

# Runs the same checks we run by hand (analyze + tests) on every push and PR,
# plus a debug build so a commit that breaks the Android build is caught.
# This workflow ONLY verifies — it never deploys, signs, or uses secrets.

on:
  push: # run on every branch push so feature/testing branches are gated too
  pull_request:
  workflow_dispatch: # allow manual runs from the Actions tab

# Cancel an in-progress run if the same ref is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Flutter app lives in the app/ subdirectory.
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Hard gate: code formatting. Non-blocking on the FIRST run so a backlog
      # of unformatted files can't make CI red on day one. Remove
      # `continue-on-error` once the repo is fully formatted to enforce it.
      - name: Check formatting (non-blocking)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed .

      # Hard gate: static analysis.
      - name: Analyze
        run: flutter analyze

      # Hard gate: the full test suite, with coverage collected.
      - name: Run tests with coverage
        run: flutter test --coverage

      # Coverage threshold is INFORMATIONAL for now (prints %, never fails).
      # To turn it into a hard gate, raise THRESHOLD and drop `|| true`.
      - name: Report coverage
        continue-on-error: true
        run: |
          THRESHOLD=70
          if [ ! -f coverage/lcov.info ]; then
            echo "No coverage/lcov.info produced; skipping."
            exit 0
          fi
          COVERED=$(grep -c '^DA:.*,[1-9]' coverage/lcov.info || true)
          TOTAL=$(grep -c '^DA:' coverage/lcov.info || true)
          if [ "$TOTAL" -gt 0 ]; then
            PCT=$(( 100 * COVERED / TOTAL ))
            echo "Line coverage: ${PCT}% (covered ${COVERED} / ${TOTAL} lines)"
            echo "Threshold (informational): ${THRESHOLD}%"
            if [ "$PCT" -lt "$THRESHOLD" ]; then
              echo "::warning::Coverage ${PCT}% is below the ${THRESHOLD}% target."
            fi
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: app/coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Debug build only — no signing keys, no upload. Just proves it compiles.
      - name: Build debug APK
        run: flutter build apk --debug
