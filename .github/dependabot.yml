version: 2

# Dependabot opens PRs (which you review/merge) to keep dependencies current.
# It never merges on its own and touches no production systems.
updates:
  # Flutter / Dart packages (pubspec.yaml lives in app/).
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - flutter
    commit-message:
      prefix: "deps"

  # GitHub Actions used by our workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
