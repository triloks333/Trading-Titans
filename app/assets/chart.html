<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Chart</title>
<!--
  The chart as the Flutter app loads it.

  Built to a SINGLE self-contained file at `app/assets/chart.html` — the library,
  the indicators and this page inlined together with no external request. That is
  not tidiness: the file loads from a local asset with no network guarantee, and the
  chart it replaces fetched the whole of tradingview.com on every open, which meant
  no chart at all on a bad connection and someone else's data when it did load.

  Flutter passes the symbol through `window.ttChart` and otherwise stays out of the
  way. The controls live here rather than in Dart so the nineteen-indicator
  catalogue exists once; see the note at the top of src/webview/controls.ts.
-->
<style>
  :root {
    --surface: #ffffff; --panel: #f4f7fb; --panel-2: #eef4fb;
    --ink: #0b1b2b; --ink3: #334e68; --ink4: #627d98; --ink5: #9fb3c8;
    --hair: #dde7f2; --accent: #1a73e8; --up: #0f9d58; --down: #d93025;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-num: ui-monospace, "SF Mono", "Roboto Mono", Consolas, monospace;
  }
  html.dark {
    --surface: #162544; --panel: #0d1527; --panel-2: #1e3054;
    --ink: #f4f7fb; --ink3: #c3d2e2; --ink4: #91a3b8; --ink5: #627d98;
    --hair: #2d4676; --accent: #3b8bf2;
  }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: var(--surface); color: var(--ink);
    font: 400 14px/1.4 var(--font-ui);
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; flex-direction: column; height: 100%; }
  #chart { flex: 1 1 auto; min-height: 0; position: relative; }

  /* ── Drawing tools. Floated top-left, clear of the price axis. ─────────── */
  #draw {
    position: absolute; top: 6px; left: 6px; z-index: 4;
    display: flex; flex-direction: column; gap: 4px;
  }
  .tt-tool {
    width: 34px; height: 34px; padding: 0;
    border: 1px solid var(--hair); border-radius: 8px;
    background: var(--surface); color: var(--ink3);
    font: 600 15px/1 var(--font-ui);
    display: inline-flex; align-items: center; justify-content: center;
    opacity: .85;
  }
  .tt-tool.on {
    background: var(--accent); border-color: var(--accent); color: #fff; opacity: 1;
  }

  /* ── Legend. Indicator values at the crosshair. ──────────────────────── */
  #legend {
    display: flex; flex-wrap: nowrap; gap: 5px; flex: none;
    padding: 5px 8px; overflow-x: auto; scrollbar-width: none;
    border-bottom: 1px solid var(--hair);
  }
  #legend::-webkit-scrollbar { display: none; }
  #legend[hidden] { display: none; }
  .tt-leg {
    flex: none; display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 7px; border: 1px solid var(--hair); border-radius: 7px;
    background: var(--panel);
  }
  .tt-leg-name {
    font: 600 9px/1 var(--font-ui); letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink5);
  }
  .tt-leg-dot { width: 7px; height: 7px; border-radius: 2px; flex: none; }
  .tt-leg-num { font: 600 11px/1 var(--font-num); color: var(--ink); }

  /* ── Control bar. 44px targets, because this is a thumb. ─────────────── */
  .tt-bar {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px; border-top: 1px solid var(--hair);
    background: var(--surface); flex: none;
  }
  .tt-periods { display: flex; gap: 3px; flex: 1 1 auto; overflow-x: auto; scrollbar-width: none; }
  .tt-periods::-webkit-scrollbar { display: none; }
  .tt-chip, .tt-btn {
    flex: none; min-height: 34px; padding: 7px 11px;
    border: 1px solid var(--hair); border-radius: 9px;
    background: var(--panel); color: var(--ink4);
    font: 600 13px/1 var(--font-num); letter-spacing: .02em;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .tt-btn { font-family: var(--font-ui); letter-spacing: 0; }
  .tt-chip.on, .tt-btn.on {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  .tt-badge { font: 700 11px/1 var(--font-num); }
  .tt-ghost { background: transparent; border-color: transparent; color: var(--accent); }

  /* ── Indicators sheet ────────────────────────────────────────────────── */
  .tt-sheet {
    position: absolute; left: 0; right: 0; bottom: 0; top: 20%;
    background: var(--surface); border-top: 1px solid var(--hair);
    border-radius: 16px 16px 0 0; z-index: 10;
    display: flex; flex-direction: column;
    box-shadow: 0 -8px 30px rgba(11,27,43,.18);
    animation: up .18s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes up { from { transform: translateY(14px); opacity: 0; } }
  .tt-sheet[hidden] { display: none; }
  .tt-sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; border-bottom: 1px solid var(--hair); flex: none;
  }
  .tt-sheet-body { overflow-y: auto; padding: 12px 14px 24px; -webkit-overflow-scrolling: touch; }
  .tt-sheet-body h4 {
    margin: 14px 0 6px; font: 600 9px/1 var(--font-ui); letter-spacing: .15em;
    text-transform: uppercase; color: var(--ink5);
  }
  .tt-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; min-height: 40px; border-bottom: 1px solid var(--hair);
  }
  .tt-row label {
    display: flex; align-items: center; gap: 10px; flex: 1 1 auto;
    font-size: 14px; color: var(--ink3); min-height: 40px;
  }
  .tt-row input[type=checkbox] { width: 19px; height: 19px; accent-color: var(--accent); margin: 0; }
  .tt-params { display: flex; gap: 4px; flex: none; }
  .tt-params input {
    width: 52px; min-height: 32px; text-align: center;
    border: 1px solid var(--hair); border-radius: 7px;
    background: var(--panel); color: var(--ink);
    /* 16px so iOS does not zoom the page on focus. */
    font: 500 16px/1 var(--font-num);
  }
  .tt-params input::-webkit-outer-spin-button,
  .tt-params input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  /* ── Saved strategies ────────────────────────────────────────────────── */
  .tt-strategies {
    background: var(--panel); border: 1px solid var(--hair);
    border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 7px;
  }
  .tt-save { display: flex; gap: 6px; }
  .tt-save input {
    flex: 1 1 auto; min-width: 0; min-height: 38px; padding: 8px 10px;
    border: 1px solid var(--hair); border-radius: 9px;
    background: var(--surface); color: var(--ink);
    font: 400 16px/1 var(--font-ui);
    user-select: text; -webkit-user-select: text;
  }
  .tt-msg { font-size: 12px; color: var(--ink5); min-height: 15px; }
  .tt-msg.ok { color: var(--up); }
  .tt-msg.bad { color: var(--down); }
  .tt-tpl {
    display: flex; align-items: center; gap: 5px;
    background: var(--surface); border: 1px solid var(--hair);
    border-radius: 9px; padding: 3px;
  }
  .tt-tpl-name {
    flex: 1 1 auto; min-width: 0; text-align: left; border: 0; background: transparent;
    padding: 8px; font: 600 14px/1 var(--font-ui); color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tt-count {
    flex: none; font: 600 11px/1 var(--font-num); color: var(--ink5);
    border: 1px solid var(--hair); border-radius: 999px; padding: 4px 7px;
  }
  .tt-icon {
    flex: none; border: 0; background: transparent; color: var(--ink5);
    min-width: 34px; min-height: 34px; font-size: 15px; border-radius: 8px;
  }
  .tt-icon.on { color: #e0a800; }
  .tt-empty { margin: 0; font-size: 13px; color: var(--ink5); line-height: 1.45; }
</style>
  
</head>
<body>
  <div id="app">
    <div id="legend" hidden></div>
    <div id="chart">
      <!-- Floats over the canvas rather than taking a row: chart height is the
           scarcest thing on a phone, and these are used occasionally. -->
      <div id="draw">
        <button class="tt-tool" data-tool="horizontal" aria-label="Horizontal level">━</button>
        <button class="tt-tool" data-tool="trend" aria-label="Trendline">╱</button>
        <button class="tt-tool" data-tool="rect" aria-label="Rectangle zone">▭</button>
        <button class="tt-tool" data-tool="fib" aria-label="Fibonacci retracement">≡</button>
        <button class="tt-tool" data-tool="arc" aria-label="Arc">◠</button>
        <button class="tt-tool" id="drawDel" aria-label="Delete drawing">✕</button>
      </div>
    </div>
    <div id="controls"></div>
  </div>
