<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #0b1b2b; 
        }
        #tradingview_widget { 
            width: 100%; 
            height: 100%; 
        }
    </style>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
    <div id="tradingview_widget"></div>
    <script type="text/javascript">
        let widget = null;

        // Comprehensive Indian market symbol mapping
        const SYMBOL_MAP = {
            // Yahoo Finance index symbols → TradingView equivalents
            '^NSEI': 'NSE:NIFTY',
            '^BSESN': 'BSE:SENSEX',
            '^NSEBANK': 'NSE:BANKNIFTY',
            '^CNXIT': 'NSE:CNXIT',
            '^CNXINFRA': 'NSE:NIFTYINFRA',
            'NIFTY': 'NSE:NIFTY',
            'NIFTY50': 'NSE:NIFTY',
            'BANKNIFTY': 'NSE:BANKNIFTY',
            'SENSEX': 'BSE:SENSEX',
            // Common crypto tickers
            'BTC': 'BINANCE:BTCUSDT',
            'ETH': 'BINANCE:ETHUSDT',
            'SOL': 'BINANCE:SOLUSDT',
            'ADA': 'BINANCE:ADAUSDT',
            'XRP': 'BINANCE:XRPUSDT',
            'DOGE': 'BINANCE:DOGEUSDT',
            'BNB': 'BINANCE:BNBUSDT',
            'MATIC': 'BINANCE:MATICUSDT',
            'DOT': 'BINANCE:DOTUSDT',
            'AVAX': 'BINANCE:AVAXUSDT',
            'SHIB': 'BINANCE:SHIBUSDT',
            'LINK': 'BINANCE:LINKUSDT',
            'LTC': 'BINANCE:LTCUSDT',
        };

        function resolveSymbol(rawSymbol) {
            let sym = rawSymbol.trim().toUpperCase();

            // Extract underlying from hyphenated option format: SYMBOL-YYYY-MM-DD-STRIKE-CE/PE
            if (sym.includes('-') && (sym.endsWith('-CE') || sym.endsWith('-PE'))) {
                sym = sym.split('-')[0];
            }

            // Clean space or hyphen qualifiers like "NSE RELIANCE" or "NSE-RELIANCE"
            if (sym.startsWith('NSE ') || sym.startsWith('NSE-')) {
                sym = 'NSE:' + sym.substring(4).trim();
            } else if (sym.startsWith('BSE ') || sym.startsWith('BSE-')) {
                sym = 'BSE:' + sym.substring(4).trim();
            }

            // Check if symbol is an option contract and extract the underlying asset
            // e.g., NIFTY260529C20000, RELIANCE260529P2500, NIFTY 23 DEC 20000 CE
            let cleanSym = sym.replace(/\s+/g, '');
            let optionMatch = cleanSym.match(/^([A-Z&]+)(?:\d{2,}|[0-9]{2}[A-Z]{3})(?:C|P|CE|PE)\d+/i);
            if (!optionMatch) {
                optionMatch = cleanSym.match(/^([A-Z&]+)\d+.*?([CP]E|[CP])/i);
            }
            if (optionMatch && optionMatch[1]) {
                sym = optionMatch[1];
            }

            // Clean suffixes from cryptos and match mapping
            let cleanCrypto = sym.replace(/[-/]?(INR|USDT)$/i, '');
            if (SYMBOL_MAP[cleanCrypto]) return SYMBOL_MAP[cleanCrypto];

            // 1. Direct map match
            if (SYMBOL_MAP[sym]) return SYMBOL_MAP[sym];

            // 2. Already exchange-qualified (e.g. NSE:RELIANCE)
            if (sym.includes(':')) return sym;

            // 3. Map to correct exchange
            if (sym.endsWith('.NS')) {
                sym = sym.replace('.NS', '');
                return 'NSE:' + sym;
            }
            if (sym.endsWith('.BO')) {
                sym = sym.replace('.BO', '');
                return 'BSE:' + sym;
            }

            // 4. Default: assume NSE stock for widget compatibility
            return 'NSE:' + sym;
        }

        function loadChart(symbol) {
            const formattedSymbol = resolveSymbol(symbol);

            // Destroy existing widget
            const container = document.getElementById('tradingview_widget');
            container.innerHTML = '';

            widget = new TradingView.widget({
                "autosize": true,
                "symbol": formattedSymbol,
                "interval": "D",
                "timezone": "Asia/Kolkata",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "toolbar_bg": "#0b1b2b",
                "enable_publishing": false,
                "hide_side_toolbar": true,
                "allow_symbol_change": true,
                "container_id": "tradingview_widget",
                "preset": "mobile",
                "disabled_features": [
                    "header_compare",
                    "header_undo_redo",
                    "header_screenshot",
                    "header_saveload",
                    "left_toolbar",
                    "widgetbar"
                ],
                "overrides": {
                    "paneProperties.background": "#0b1b2b",
                    "paneProperties.backgroundType": "solid"
                }
            });
        }

        // Initialize default
        loadChart("NSE:NIFTY");
    </script>
</body>
</html>
